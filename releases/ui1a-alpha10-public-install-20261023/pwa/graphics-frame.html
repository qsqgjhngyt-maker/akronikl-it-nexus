<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; worker-src blob:; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Nexus · isolated scene</title></head><body><script>
// Отдельный opaque sandbox. CSP оболочки не разрешает inline/eval и не меняется.
// Принимается один документ только от родителя с одноразовым случайным каналом.
const loaderNonce=location.hash.slice(1);
if(parent!==self&&self.origin==='null'&&/^[-a-zA-Z0-9]{36}$/.test(loaderNonce)){const receive=event=>{if(event.source!==parent||event.data?.nonce!==loaderNonce||event.data?.type!=='nexus-scene-document'||typeof event.data.html!=='string'||event.data.html.length>500000)return;removeEventListener('message',receive);parent.postMessage({type:'nexus-scene-document-accepted',nonce:loaderNonce},'*');document.open();document.write(event.data.html);document.close()};addEventListener('message',receive);parent.postMessage({type:'nexus-scene-loader-ready',nonce:loaderNonce},'*')}
</script></body></html>
