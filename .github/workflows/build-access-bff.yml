name: Build access BFF image (no cloud credentials)
on:
  push:
    branches: [main, feature/akronikl-p4q-corpus-20261028]
    paths: ['server-access/**', 'tools/check-access-image-start.mjs', 'tools/publication-auth*.mjs', '.github/workflows/build-access-bff.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate the reviewed network bootstrap from the lockfile
        run: |
          npm ci --prefix server-access --ignore-scripts
          node server-access/build-network-bootstrap.mjs
      - name: Проверить запрет Cache.put для реального ответа BFF
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CACHE_BOUNDARY_EVIDENCE: cache-boundary-evidence.json
        run: node server-access/check-legacy-cache-boundary.mjs
      - name: Сохранить результат браузерной проверки
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-cache-boundary-evidence
          path: cache-boundary-evidence.json
          retention-days: 2
      - name: Build audited BFF image
        run: |
          docker build --platform linux/amd64 -t nexus-access-bff:${GITHUB_SHA} server-access/image
          node tools/check-access-image-start.mjs nexus-access-bff:${GITHUB_SHA} image-startup-evidence.json
          docker save nexus-access-bff:${GITHUB_SHA} -o nexus-access-bff.tar
          sha256sum nexus-access-bff.tar > nexus-access-bff.tar.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-access-bff-image
          path: |
            nexus-access-bff.tar
            nexus-access-bff.tar.sha256
            cache-boundary-evidence.json
            image-startup-evidence.json
          retention-days: 2
