name: C++ — CPP-CLARITY-01, проверка кандидата без публикации
on:
  push:
    branches: [feature/cpp-clarity-01-m1-m2-20261104]
  pull_request:
    branches: [main]
    paths:
      - 'courses/cpp/**'
      - 'courses/clarity/**'
      - 'courses/cpp-clarity-r3/**'
      - 'courses/onec-education/**'
      - 'core/*clarity*.mjs'
      - 'review/cpp-clarity-r3/**'
      - 'core/academy-gold-presentation.js'
      - 'core/learning-views.js'
      - 'core/app.js'
      - 'core/cpp-clarity-presentation.js'
      - 'core/nexus-learning-discovery.js'
      - 'pwa/offline-entry.js'
      - 'styles/academy-gold.css'
      - 'tools/*cpp-clarity*'
      - 'tests/*cpp-clarity*'
      - 'tests/helpers/cpp-clarity-*'
      - 'tools/build-academy-gold-laboratories.mjs'
      - 'docs/ru/03-content/cpp-clarity-01/**'
      - '.github/workflows/cpp-clarity-01.yml'
permissions:
  contents: read
concurrency:
  group: cpp-clarity-01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  onec-p1:
    name: 1С P1 — уроки, наглядность, работа и offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXUS_CLARITY_EVIDENCE: ${{ github.workspace }}/onec-p1-evidence
      NEXUS_FRONTEND_DIR: ${{ github.workspace }}/onec-p1-frontend
      NEXUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/qa-browser-driver/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить содержание и собрать отдельный непубликованный кандидат
        run: |
          npm ci --prefix server-access --ignore-scripts
          npm ci --prefix tools/qa-browser-driver
          node tools/qa-browser-driver/node_modules/playwright/cli.js install --with-deps chromium
          node --test tests/cpp-clarity-onec-p1-content.test.mjs tests/cpp-clarity-onec-p2-types-content.test.mjs
          node tools/build-cpp-clarity-candidate.mjs
      - name: Проверить восемь редакций, настоящие изображения, редактор и холодный offline
        run: node tests/cpp-clarity-onec-p1-browser.mjs
      - name: Отдельно проверить первую пару P2, матовый фон, работу и offline
        run: node tests/cpp-clarity-onec-p2-types-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onec-p1-${{ github.sha }}
          path: onec-p1-evidence/
          retention-days: 30
          if-no-files-found: error
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXUS_CLARITY_EVIDENCE: ${{ github.workspace }}/cpp-clarity-evidence
      NEXUS_FRONTEND_DIR: ${{ github.workspace }}/cpp-clarity-frontend
      NEXUS_PINNED_RUNTIME_DIR: ${{ github.workspace }}/cpp-clarity-runtime
      NEXUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/qa-browser-driver/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Подготовить закреплённые зависимости проверок
        run: |
          npm ci --prefix server-access --ignore-scripts
          npm ci --prefix tools/qa-browser-driver
          node tools/qa-browser-driver/node_modules/playwright/cli.js install --with-deps chromium
      - name: Обязательный технический gate кандидата
        run: |
          set -euo pipefail
          mkdir -p cpp-clarity-evidence
          node tools/check-cpp-clarity.mjs
      - name: R3 — отдельный учебный экран
        env:
          NEXUS_REVIEW_HEADLESS: '1'
          NEXUS_CLARITY_R3_EVIDENCE: ${{ github.workspace }}/cpp-clarity-evidence/r3
        run: |
          node tools/check-cpp-clarity-r3-review.mjs
      - name: Настоящий host C++20 и UBSan — отдельно от браузера
        env:
          NEXUS_GOLD_EVIDENCE: ${{ github.workspace }}/cpp-clarity-evidence/previous-m1-host
          NEXUS_M2_EVIDENCE: ${{ github.workspace }}/cpp-clarity-evidence/previous-m2-host
        run: |
          node tools/check-cpp-clarity-host.mjs
          node tools/check-cpp-clarity-b1-host.mjs
          node tools/check-cpp-clarity-b1-host.mjs --b2
          node tools/check-academy-gold-cpp.mjs
          node tools/check-academy-gold-module2-examples.mjs
      - name: Собрать непубликованный кандидат и подготовить проверенный runtime
        env:
          NEXUS_GOLD_EVIDENCE: ${{ github.workspace }}/cpp-clarity-evidence/runtime-bytes
        run: |
          node tools/build-cpp-clarity-candidate.mjs
          node tools/prepare-academy-gold-runtime-fixture.mjs
      - name: R3 — настоящие программы C++
        env:
          NEXUS_CLARITY_R3_EVIDENCE: ${{ github.workspace }}/cpp-clarity-evidence/r3
        run: |
          node tests/cpp-clarity-r3-runtime.mjs
      - name: Настоящий Clang-WASI, сохранность, мобильные экраны и холодный offline
        run: |
          node tests/cpp-clarity-r3-app-browser.mjs
          node tests/cpp-clarity-types-browser.mjs
          node tests/cpp-clarity-b1-browser.mjs
          node tests/cpp-clarity-b1-browser.mjs --b2
          node tests/cpp-clarity-courses-browser.mjs
          node tests/cpp-clarity-r3-pilot-browser.mjs
          node tests/cpp-clarity-r3-account-browser.mjs
          node tests/cpp-clarity-r3-vault-branch.mjs
          node tests/cpp-clarity-r3-pilot-preview-browser.mjs
          node tests/cpp-clarity-browser.mjs
          node tests/cpp-clarity-cold-browser.mjs
          node tests/cpp-clarity-account-adapter-browser.mjs
          NEXUS_PREVIEW_HEADLESS=1 node tests/cpp-clarity-preview-browser.mjs
      - name: Сохранить текущие текстовые исходники и хеши
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, hashlib, json, zipfile
          root=pathlib.Path('.')
          out=root/'cpp-clarity-evidence';out.mkdir(exist_ok=True)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          paths=subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split('\0')
          allowed={'.md','.txt','.json','.mjs','.js','.css','.html','.yml','.yaml','.py','.sh','.cpp','.hpp','.h','.c','.cmake','.toml','.ps1','.cmd','.bsl','.query'}
          roots={'core','courses','sandbox','styles','pwa','effects','akronikl','content','tools','tests','server-access','.github'}
          hashes=[];included=[];total=0
          with zipfile.ZipFile(out/'source-text.zip','w',zipfile.ZIP_DEFLATED) as z:
            for rel in paths:
              if not rel: continue
              p=root/rel
              if not p.is_file() or p.is_symlink(): continue
              b=p.read_bytes()
              hashes.append({'path':rel,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
              parts=p.parts
              in_scope=len(parts)==1 or parts[0] in roots or rel.startswith('docs/ru/03-content/cpp-clarity-01/') or rel.startswith('review/cpp-clarity-r3/')
              if not in_scope: continue
              if any(x in parts for x in ('node_modules','dist','evidence','releases','retained','vendor-cache')): continue
              if '.env' in p.name or any(k in p.name.lower() for k in ('credential','secret-key','private-key')): continue
              if p.suffix not in allowed and p.name not in ('LICENSE','CMakeLists.txt','.gitattributes','.gitignore'): continue
              if len(b)>8*1024*1024: continue
              try: b.decode('utf-8')
              except UnicodeDecodeError: continue
              total+=len(b)
              if total>100*1024*1024: raise RuntimeError('Current source snapshot exceeds the explicit 100 MiB cap')
              z.writestr(rel,b);included.append(rel)
          (out/'SOURCE.json').write_text(json.dumps({'sourceCommit':source,'baseline':'ee2787c0cd92da2ad1d5e79df5e2bfadab2c3dd6','kind':'current-text-only-source-not-release','includedFiles':len(included),'uncompressedBytes':total,'publicationAuthorized':False},indent=2)+'\n')
          (out/'TRACKED_SHA256.json').write_text(json.dumps(hashes,ensure_ascii=False,indent=2)+'\n')
          b=(out/'source-text.zip').read_bytes()
          (out/'SOURCE_SHA256.txt').write_text(hashlib.sha256(b).hexdigest()+'  source-text.zip\n')
          PY
      - name: Evidence без merge, deployment или Release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-clarity-01-${{ github.sha }}
          path: cpp-clarity-evidence/
          retention-days: 30
          if-no-files-found: error
  structured:
    name: B03 — структурное программирование
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXUS_CLARITY_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b3-evidence
      NEXUS_M3_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b3-evidence/native
      NEXUS_B3_STARTERS: '1'
      NEXUS_GOLD_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b3-evidence/runtime-bytes
      NEXUS_FRONTEND_DIR: ${{ github.workspace }}/cpp-clarity-frontend
      NEXUS_PINNED_RUNTIME_DIR: ${{ github.workspace }}/cpp-clarity-runtime
      NEXUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/qa-browser-driver/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить конечные редакции и выполнить C++20 с UBSan
        run: |
          node --test tests/cpp-clarity-b3-content.test.mjs
          node tools/check-academy-gold-module3-examples.mjs
      - name: Собрать локального кандидата с закреплённым runtime
        run: |
          npm ci --prefix server-access --ignore-scripts
          npm ci --prefix tools/qa-browser-driver
          node tools/qa-browser-driver/node_modules/playwright/cli.js install --with-deps chromium
          node tools/build-cpp-clarity-candidate.mjs
          node tools/prepare-academy-gold-runtime-fixture.mjs
      - name: Проверить 36 редакций, рабочее окно, файлы и холодный offline
        run: node tests/cpp-clarity-b3-browser.mjs
      - name: Сохранить evidence B03
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-clarity-b3-${{ github.sha }}
          path: cpp-clarity-b3-evidence/
          retention-days: 30
          if-no-files-found: error

  classic:
    name: B04 — классические задачи
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXUS_CLARITY_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b4-evidence
      NEXUS_M4_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b4-evidence/native
      NEXUS_B4_PROGRAMS: '1'
      NEXUS_FRONTEND_DIR: ${{ github.workspace }}/cpp-clarity-frontend
      NEXUS_PINNED_RUNTIME_DIR: ${{ github.workspace }}/cpp-clarity-runtime
      NEXUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/qa-browser-driver/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить 16 редакций и выполнить C++20 с UBSan
        run: |
          node --test tests/cpp-clarity-b4-content.test.mjs
          node tools/check-academy-gold-module4-examples.mjs
      - name: Собрать кандидата с закреплённым runtime
        run: |
          npm ci --prefix server-access --ignore-scripts
          npm ci --prefix tools/qa-browser-driver
          node tools/qa-browser-driver/node_modules/playwright/cli.js install --with-deps chromium
          node tools/build-cpp-clarity-candidate.mjs
          node tools/prepare-academy-gold-runtime-fixture.mjs
      - name: Проверить уроки, рабочее окно и реальные результаты Clang/WASI
        run: node tests/cpp-clarity-b4-browser.mjs
      - name: Сохранить evidence B04
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-clarity-b4-${{ github.sha }}
          path: cpp-clarity-b4-evidence/
          retention-days: 30
          if-no-files-found: error

  oop:
    name: B05 — объектно-ориентированное программирование
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXUS_CLARITY_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b5-evidence
      NEXUS_M5_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b5-evidence/native
      NEXUS_B5_PROGRAMS: '1'
      NEXUS_FRONTEND_DIR: ${{ github.workspace }}/cpp-clarity-frontend
      NEXUS_PINNED_RUNTIME_DIR: ${{ github.workspace }}/cpp-clarity-runtime
      NEXUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/qa-browser-driver/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить 18 редакций и выполнить C++20 с UBSan
        run: |
          node --test tests/cpp-clarity-b5-content.test.mjs
          node tools/check-academy-gold-module5-examples.mjs
      - name: Собрать кандидата с закреплённым runtime
        run: |
          npm ci --prefix server-access --ignore-scripts
          npm ci --prefix tools/qa-browser-driver
          node tools/qa-browser-driver/node_modules/playwright/cli.js install --with-deps chromium
          node tools/build-cpp-clarity-candidate.mjs
          node tools/prepare-academy-gold-runtime-fixture.mjs
      - name: Проверить уроки, рабочее окно и реальные результаты Clang/WASI
        run: node tests/cpp-clarity-b5-browser.mjs
      - name: Сохранить evidence B05
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-clarity-b5-${{ github.sha }}
          path: cpp-clarity-b5-evidence/
          retention-days: 30
          if-no-files-found: error

  events:
    name: B06 — события, реальные C++20 и Clang/WASI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXUS_CLARITY_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b6-evidence
      NEXUS_M6_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b6-evidence/native
      NEXUS_B6_PROGRAMS: '1'
      NEXUS_FRONTEND_DIR: ${{ github.workspace }}/cpp-clarity-frontend
      NEXUS_PINNED_RUNTIME_DIR: ${{ github.workspace }}/cpp-clarity-runtime
      NEXUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/qa-browser-driver/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить24 редакции и выполнить C++20 с UBSan
        run: |
          node --test tests/cpp-clarity-b6-content.test.mjs
          node tools/check-academy-gold-module6-gold-native.mjs
      - name: Собрать локального кандидата с закреплённым runtime
        run: |
          npm ci --prefix server-access --ignore-scripts
          npm ci --prefix tools/qa-browser-driver
          node tools/qa-browser-driver/node_modules/playwright/cli.js install --with-deps chromium
          node tools/build-cpp-clarity-candidate.mjs
          node tools/prepare-academy-gold-runtime-fixture.mjs
      - name: Проверить навигацию, рабочее окно, эталоны и холодный offline
        run: node tests/cpp-clarity-b6-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-clarity-b6-${{ github.sha }}
          path: cpp-clarity-b6-evidence/
          retention-days: 30
          if-no-files-found: error

  events-qt:
    name: B06 — настоящие Qt, фильтр, данные и переносимость
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXUS_M6_EVIDENCE: ${{ github.workspace }}/cpp-clarity-b6-qt-evidence
      NEXUS_QT_EVIDENCE_DIR: ${{ github.workspace }}/cpp-clarity-b6-qt-evidence
      NEXUS_FRONTEND_DIR: ${{ github.workspace }}/cpp-clarity-frontend
      NEXUS_PINNED_RUNTIME_DIR: ${{ github.workspace }}/cpp-clarity-runtime
      NEXUS_JSCPP_FIXTURE: ${{ github.workspace }}/cpp-clarity-runtime/jscpp.js
      NEXUS_QT_BROWSER_PACK: ${{ github.workspace }}/cpp-clarity-qt-runtime
      NEXUS_STUDIO_TEST_STORE: ${{ github.workspace }}/cpp-clarity-synthetic-private-jobs
      NEXUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/qa-browser-driver/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Подготовить изолированный браузер и проверенные Qt bytes
        run: |
          npm ci --prefix server-access --ignore-scripts
          npm ci --prefix tools/qa-browser-driver
          node tools/qa-browser-driver/node_modules/playwright/cli.js install --with-deps chromium
          node tools/build-cpp-clarity-candidate.mjs
          node tools/prepare-academy-gold-runtime-fixture.mjs
          node tools/check-cpp-clarity-b6-qt-bytes.mjs
      - name: Проверить быстрый переход с ответом, затем настоящие события Qt
        run: |
          node --test tests/cpp-clarity-qt-diagnostic.test.mjs
          node tests/cpp-clarity-qt-reading-browser.mjs
          node tests/cpp-clarity-b6-qt-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-clarity-b6-qt-${{ github.sha }}
          path: cpp-clarity-b6-qt-evidence/
          retention-days: 30
          if-no-files-found: error
