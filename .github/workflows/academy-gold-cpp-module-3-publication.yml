name: C++ Modules 3/4 — точная тестовая публикация и откат
on:
  push:
    branches: [feature/academy-gold-standard-cpp-module-3, feature/academy-gold-standard-cpp-module-4, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  content_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Определить область по доверенному source, без релизного допуска
        id: scope
        env:
          NEXUS_ROUTE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NEXUS_ROUTE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NEXUS_ROUTE_BRANCH: ${{ github.head_ref || github.ref_name }}
          NEXUS_ROUTE_PR: ${{ github.event.pull_request.number }}
          NEXUS_CONTENT_ROUTE_BOOTSTRAP_SHA: '459fbed76c287733e556f05829661f2ae4659a03'
        run: |
          set -euo pipefail
          [[ "$NEXUS_ROUTE_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NEXUS_ROUTE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          if git cat-file -e "$NEXUS_ROUTE_BASE:tools/content-publication-route.mjs" 2>/dev/null; then
            export NEXUS_ROUTE_TRUSTED="$NEXUS_ROUTE_BASE"
          else
            export NEXUS_ROUTE_TRUSTED="$NEXUS_CONTENT_ROUTE_BOOTSTRAP_SHA"
          fi
          git show "$NEXUS_ROUTE_TRUSTED:tools/content-publication-route.mjs" > "$RUNNER_TEMP/nexus-content-route.mjs"
          node "$RUNNER_TEMP/nexus-content-route.mjs"
      - name: Сохранить решение маршрутизации
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-publication-scope-${{ github.sha }}
          path: content-publication-scope.json
  content_review:
    needs: content_scope
    if: needs.content_scope.outputs.kind == 'content-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить Content Contract, без publication или deployment
        run: |
          node tools/validate-content.mjs
          node tools/check-content-review.mjs
          node --test tests/content-contract.test.mjs
  publication:
    needs: content_scope
    if: needs.content_scope.outputs.kind == 'historical-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXUS_M3_EVIDENCE: academy-gold-m3-publication/static
      NEXUS_M4_PUBLICATION_EVIDENCE: academy-gold-m3-publication/static
      NEXUS_FRONTEND_DIR: /tmp/nexus-m3-publication-build
      NEXUS_PLAYWRIGHT_MODULE: /tmp/nexus-m3-publication-browser/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить отдельный контракт Intro без изменения допуска M5
        id: startup_intro
        run: node tools/startup-intro-ci-route.mjs
      - name: Node.js 24 для изолированной проверки Intro
        if: steps.startup_intro.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Приёмка Intro — publication
        if: steps.startup_intro.outputs.enabled == 'true'
        run: node tools/check-startup-intro-ci.mjs --lane publication
      - name: Сохранить доказательства Intro — publication
        if: always() && steps.startup_intro.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: startup-intro-publication-${{ github.sha }}
          path: evidence-startup-intro/publication/
          retention-days: 14
      - name: Проверить точный принятый source, все поколения и повторную сборку
        if: steps.startup_intro.outputs.enabled != 'true'
        run: |
          npm ci --prefix server-access --ignore-scripts --no-audit --no-fund
          node tools/check-academy-gold-module3-publication.mjs
          node tests/release-version-consistency-check.mjs
          node --test tests/published-worker-configuration.test.mjs
          node tools/check-academy-gold-module3-dependencies.mjs
          node tools/check-academy-gold-module3-quality.mjs
          node tests/academy-gold-module3-preservation.mjs
          node --test tests/academy-gold-module3-navigation.test.mjs
      - name: Подготовить текущий пакет и точные прежние опубликованные bytes
        if: steps.startup_intro.outputs.enabled != 'true'
        run: |
          npm install --prefix /tmp/nexus-m3-publication-browser --no-save playwright@1.56.1
          /tmp/nexus-m3-publication-browser/node_modules/.bin/playwright install --with-deps chromium
          node tools/build-ui1a-release.mjs --out /tmp/nexus-m3-publication-build
          ROLLBACK_SHA=$(node -p "JSON.parse(require('fs').readFileSync('release-candidate.json')).publication.rollbackCommit")
          git worktree add --detach /tmp/nexus-m3-publication-rollback-source "$ROLLBACK_SHA"
          node tools/snapshot-published-build.mjs --source /tmp/nexus-m3-publication-rollback-source --out /tmp/nexus-m3-publication-rollback --expected-commit "$ROLLBACK_SHA"
      - name: Настоящий SW — upgrade, точный rollback и сохранность учебных данных
        if: steps.startup_intro.outputs.enabled != 'true'
        env:
          NEXUS_ROLLBACK_DIR: /tmp/nexus-m3-publication-rollback
          NEXUS_BROWSER_RESULT: academy-gold-m3-publication/PWA_ROLLBACK.json
        run: node tests/pwa-rollback-browser-check.mjs
      - name: Home, Account и media текущего пакета
        if: steps.startup_intro.outputs.enabled != 'true'
        run: |
          NEXUS_NATIVE_EVIDENCE=academy-gold-m3-publication/startup node tests/platform-startup-browser-check.mjs
          NEXUS_NATIVE_EVIDENCE=academy-gold-m3-publication/media node tests/blog-media-public-browser-check.mjs
      - name: Сохранить фактические результаты, включая FAIL
        if: always() && steps.startup_intro.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: academy-gold-m3-publication-${{ github.sha }}
          path: academy-gold-m3-publication/
          retention-days: 30
