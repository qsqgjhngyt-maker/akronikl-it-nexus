name: Alpha10.4 - проверка интеграционной сборки (без публикации)
on:
  push:
    branches:
      - feature/alpha10-4-integration-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      LC_ALL: C.UTF-8
    steps:
      - name: Получить точные исходники feature-ветки
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Проверить runtime Node.js
        run: |
          node --version
          npm --version
          git rev-parse HEAD
      - name: Установить закреплённые зависимости только для проверки
        run: npm ci --prefix server-access --no-audit --no-fund
      - name: Проверить frontend, авторизацию и сохранность данных
        run: |
          set -euo pipefail
          node --test tests/platform-startup-load.test.mjs tests/platform-lazy-imports.test.mjs
          node tests/auth-bootstrap-check.mjs
          node tests/session-only-resume-check.mjs
          node tests/account-storage-isolation-check.mjs
          node tests/first-party-cookie-client-check.mjs
          node tests/account-control-transport-check.mjs
          node tests/entry-document-navigation-check.mjs
          node tests/oauth-link-client-check.mjs
          node tests/pwa-controller-check.mjs
          node tests/pwa-policy-check.mjs
          node tests/pwa-public-install-check.mjs
      - name: Проверить Блог, CMS, Академию, Studio и Cloud Sync
        run: |
          set -euo pipefail
          node tests/blog-layout-security-check.mjs
          node tests/blog-presentation-security-check.mjs
          node tests/blog-legacy-compat-check.mjs
          node tests/public-content-check.mjs
          node tests/benchmark-content-check.mjs
          node tests/code-studio-foundation-check.mjs
          node tests/project-studio-foundation-check.mjs
          node tests/cloud-sync-client-transport-check.mjs
          node tests/cloud-unified-client-check.mjs
          node --test tests/content-contract.test.mjs
      - name: Официальная сборка неизменённым производственным сборщиком
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexus-alpha10-4-evidence"
          node tools/build-ui1a-release.mjs --out "$RUNNER_TEMP/nexus-alpha10-4-public" | tee "$RUNNER_TEMP/nexus-alpha10-4-evidence/build.log"
          node tests/ui1a-versioned-build-check.mjs | tee "$RUNNER_TEMP/nexus-alpha10-4-evidence/repro.log"
      - name: Независимая проверка integrity, PWA ID и старой генерации
        env:
          BUILD_DIR: ${{ runner.temp }}/nexus-alpha10-4-public
          QA_DIR: ${{ runner.temp }}/nexus-alpha10-4-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          out=pathlib.Path(os.environ['BUILD_DIR']);qa=pathlib.Path(os.environ['QA_DIR'])
          manifest=json.loads((out/'BUILD_MANIFEST.json').read_text())
          expected='ui1a-alpha10-4-perf-session-20261023'
          assert manifest['assetGeneration']==expected
          assert manifest['version']=='0.1.7-alpha.2.4.6-ui1a.10.4'
          assert manifest['verifiedWorkerIncluded'] is True and manifest['legacyWorkerIncluded'] is False
          assert manifest['publicAuthority'].startswith('EXACT PUBLIC STATIC')
          assert manifest['manifestIdentity']==json.loads(pathlib.Path('manifest.webmanifest').read_text())
          assert (out/'service-worker.js').exists()
          assert expected in (out/'service-worker.js').read_text()
          old='releases/ui1a-alpha10-public-install-20261023/core/bootstrap.js'
          assert any(x['file']==old for x in manifest['files']), 'Existing installed PWA generation lost'
          assert any(x['file']==f'releases/{expected}/core/bootstrap.js' for x in manifest['files'])
          items=[]
          for obj in manifest['files']:
            f=out/obj['file'];b=f.read_bytes()
            assert len(b)==obj['bytes'],obj['file']
            assert hashlib.sha256(b).hexdigest()==obj['sha256'],obj['file']
            items.append(obj['file'])
          assert len(items)==len(set(items))
          assert not any('/api/v2/' in p or 'server-access/' in p for p in items), 'Private/API asset in public generation'
          status={'version':manifest['version'],'assetGeneration':expected,'files_verified':len(items),'pwa_id_stable':True,'old_generation_retained':True,'public_integrity':'PASS','releaseGate':'LOCAL BUILD ONLY; NO LIVE/PRODUCTION AUTHORIZATION'}
          (qa/'VERIFICATION.json').write_text(json.dumps(status,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(status,ensure_ascii=False))
          PY
      - name: Упаковать официальный build в артефакт без секретов
        env:
          BUILD_DIR: ${{ runner.temp }}/nexus-alpha10-4-public
          QA_DIR: ${{ runner.temp }}/nexus-alpha10-4-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,shutil,pathlib
          path=pathlib.Path(os.environ['BUILD_DIR'])
          qa=pathlib.Path(os.environ['QA_DIR'])
          out=qa/'ALPHA10_4_OFFICIAL_BUILD.zip'
          shutil.make_archive(str(out.with_suffix('')),'zip',root_dir=path)
          print('Official build ZIP bytes:',out.stat().st_size)
          PY
          sha256sum "$QA_DIR/ALPHA10_4_OFFICIAL_BUILD.zip" > "$QA_DIR/ALPHA10_4_OFFICIAL_BUILD.zip.sha256"
      - name: Сохранить независимые доказательства без развёртывания
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-alpha10-4-integration-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-alpha10-4-evidence/
          if-no-files-found: warn
          retention-days: 7
