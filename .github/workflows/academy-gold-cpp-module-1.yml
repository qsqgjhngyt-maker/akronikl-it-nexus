name: Академия C++ Gold — модуль 1
on:
  push:
    branches: [feature/academy-gold-standard-cpp-module-1, main]
  pull_request:
    branches: [main]
    paths:
      - 'courses/cpp/gold/**'
      - 'core/academy-gold-*.js'
      - 'core/app.js'
      - 'core/course-registry.js'
      - 'core/learning-views.js'
      - 'core/nexus-learning-ui.js'
      - 'styles/app.css'
      - 'tests/helpers/glossary-drawer-checks.mjs'
      - 'core/offline-assets.js'
      - 'pwa/offline-entry.js'
      - 'styles/academy-gold.css'
      - 'effects/nexus-solar-system.js'
      - 'effects/nexus-solar-renderer.js'
      - 'tests/platform-lazy-imports.test.mjs'
      - 'tests/platform-startup-load.test.mjs'
      - 'tests/academy-gold-*'
      - 'sandbox/providers/browser-runtime.js'
      - 'tests/cpp-stream-state-routing.test.mjs'
      - 'tests/helpers/online-runtime-fixture.mjs'
      - 'tools/prepare-academy-gold-runtime-fixture.mjs'
      - 'tests/platform-startup-browser-check.mjs'
      - 'tests/identity-session-foundation-check.mjs'
      - 'tests/shared-presentation-check.mjs'
      - 'tests/ui1a-versioned-build-check.mjs'
      - 'tools/build-ui1a-release.mjs'
      - 'tools/check-academy-gold-*'
      - 'release-candidate.json'
      - 'version.json'
      - 'BUILD_MANIFEST.json'
      - '.github/workflows/academy-gold-cpp-module-1.yml'
permissions:
  contents: read
jobs:
  gold-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Зафиксированные зависимости проверок
        run: npm ci --prefix server-access --ignore-scripts --no-audit --no-fund
      - name: Неизменность ID, прогресса, Identity, Cloud; только согласованный runtime patch
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('release-candidate.json')).publication?.module==='cpp-module-3'?0:1)"; then
            node tools/check-academy-gold-module3-publication.mjs
          elif node -e "process.exit(JSON.parse(require('fs').readFileSync('release-candidate.json')).publication?.sourceCommit==='e743bd537c09e8ae5bbf09d72cd5fc4980bc92dd'?0:1)"; then
            node tools/check-academy-gold-module2-publication.mjs
          else
            git diff --exit-code bad182cc020e51dcfd0b36a7b0127c637c8f79ee HEAD -- courses/cpp/curriculum.json courses/cpp/content-package.json courses/cpp/data core/storage.js core/account-storage.js core/identity.js core/migrations sync sandbox project-studio server-access pwa/local-vault.js pwa/offline-learning.js pwa/runtime-manifest.js pwa/service-worker.js ':(exclude)sandbox/providers/browser-runtime.js'
          fi
      - name: Content Quality Gate и совместимость
        run: node tools/check-academy-gold-regression.mjs
      - name: Интеграция с подтверждённым main и сохранность rollback
        run: |
          git merge-base --is-ancestor 0a134bbb496efae19df373bddff9a00dae9ff3dc HEAD
          node tools/check-academy-gold-integration.mjs
      - name: Реальное выполнение C++20 с проверкой undefined behavior
        run: node tools/check-academy-gold-cpp.mjs
      - name: Подготовить браузерную проверку
        run: |
          npm install --prefix /tmp/nexus-gold-browser --no-save playwright@1.56.1
          /tmp/nexus-gold-browser/node_modules/.bin/playwright install --with-deps chromium
          node tools/build-ui1a-release.mjs --out /tmp/nexus-gold-build
          git worktree add --detach /tmp/nexus-gold-rollback-source 02369149b465a98c0f3ff780b8c59add36e52e1b
          node tools/snapshot-published-build.mjs --source /tmp/nexus-gold-rollback-source --out /tmp/nexus-gold-rollback --expected-commit 02369149b465a98c0f3ff780b8c59add36e52e1b
      - name: Настоящие браузерные C++ runtime — все Gold программы и случаи ввода
        env:
          NEXUS_FRONTEND_DIR: /tmp/nexus-gold-build
          NEXUS_PLAYWRIGHT_MODULE: /tmp/nexus-gold-browser/node_modules/playwright/index.mjs
          NEXUS_NATIVE_EVIDENCE: academy-gold-evidence/runtime-browser
          NEXUS_PINNED_RUNTIME_DIR: /tmp/nexus-gold-runtime
          NEXUS_JSCPP_FIXTURE: /tmp/nexus-gold-runtime/jscpp.js
        run: |
          node tools/prepare-academy-gold-runtime-fixture.mjs
          node tests/academy-gold-runtime-browser-check.mjs
      - name: Настоящие online и холодный Offline entry points
        env:
          NEXUS_FRONTEND_DIR: /tmp/nexus-gold-build
          NEXUS_PLAYWRIGHT_MODULE: /tmp/nexus-gold-browser/node_modules/playwright/index.mjs
          NEXUS_NATIVE_EVIDENCE: academy-gold-evidence/browser
        run: node tests/academy-gold-browser-check.mjs
      - name: Браузерная интеграция Home, меню, Account и media
        env:
          NEXUS_FRONTEND_DIR: /tmp/nexus-gold-build
          NEXUS_PLAYWRIGHT_MODULE: /tmp/nexus-gold-browser/node_modules/playwright/index.mjs
        run: |
          NEXUS_NATIVE_EVIDENCE=academy-gold-evidence/startup node tests/platform-startup-browser-check.mjs
          NEXUS_NATIVE_EVIDENCE=academy-gold-evidence/administration node tests/platform-admin-browser-check.mjs
          NEXUS_NATIVE_EVIDENCE=academy-gold-evidence/public-media node tests/blog-media-public-browser-check.mjs
      - name: Реальная PWA — обновление, точный откат и сохранение учебных данных
        env:
          NEXUS_FRONTEND_DIR: /tmp/nexus-gold-build
          NEXUS_ROLLBACK_DIR: /tmp/nexus-gold-rollback
          NEXUS_PLAYWRIGHT_MODULE: /tmp/nexus-gold-browser/node_modules/playwright/index.mjs
          NEXUS_BROWSER_RESULT: academy-gold-evidence/PWA_ROLLBACK.json
        run: node tests/pwa-rollback-browser-check.mjs
      - name: Хеши и контекст evidence
        if: always()
        run: |
          mkdir -p academy-gold-evidence
          git rev-parse HEAD > academy-gold-evidence/HEAD.txt
          git diff --stat bad182cc020e51dcfd0b36a7b0127c637c8f79ee HEAD > academy-gold-evidence/DIFF.txt
          find courses/cpp/gold core -type f \( -path 'courses/cpp/gold/*' -o -name 'academy-gold-*.js' \) -print0 | sort -z | xargs -0 sha256sum > academy-gold-evidence/SHA256SUMS.txt
      - name: Сохранить доказательства
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-gold-module-1-${{ github.sha }}
          path: academy-gold-evidence/
          retention-days: 30
