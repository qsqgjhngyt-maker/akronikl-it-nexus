name: Академия C++ Gold — Module 2, runtime и регрессия Module 1
on:
  push:
    branches: [feature/academy-gold-standard-cpp-module-2, main]
  pull_request:
    branches: [main]
    paths:
      - 'courses/cpp/gold/**'
      - 'core/**'
      - 'sandbox/**'
      - 'tools/check-academy-gold-*'
      - 'release-candidate.json'
      - 'version.json'
      - 'BUILD_MANIFEST.json'
      - '.github/workflows/academy-gold-cpp-module-2-preflight.yml'
permissions:
  contents: read
jobs:
  content_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Определить область по доверенному source, без релизного допуска
        id: scope
        env:
          NEXUS_ROUTE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NEXUS_ROUTE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NEXUS_ROUTE_BRANCH: ${{ github.head_ref || github.ref_name }}
          NEXUS_ROUTE_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          export NEXUS_CONTENT_ROUTE_BOOTSTRAP_SHA=$(git show "$NEXUS_ROUTE_HEAD:.github/workflows/academy-gold-cpp-module-3-publication.yml" | tr -d '\r' | sed -nE "s/^ +NEXUS_CONTENT_ROUTE_BOOTSTRAP_SHA: '([a-f0-9]{40})'$/\1/p")
          [[ "$NEXUS_CONTENT_ROUTE_BOOTSTRAP_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NEXUS_ROUTE_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NEXUS_ROUTE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          if git cat-file -e "$NEXUS_ROUTE_BASE:tools/content-publication-route.mjs" 2>/dev/null; then
            export NEXUS_ROUTE_TRUSTED="$NEXUS_ROUTE_BASE"
          else
            export NEXUS_ROUTE_TRUSTED="$NEXUS_CONTENT_ROUTE_BOOTSTRAP_SHA"
          fi
          git show "$NEXUS_ROUTE_TRUSTED:tools/content-publication-route.mjs" > "$RUNNER_TEMP/nexus-content-route.mjs"
          node "$RUNNER_TEMP/nexus-content-route.mjs"
      - name: Сохранить решение маршрутизации
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-publication-scope-${{ github.sha }}
          path: content-publication-scope.json
  content_review:
    needs: content_scope
    if: needs.content_scope.outputs.kind == 'content-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONEC_REGRESSION_EVIDENCE: ${{ runner.temp }}/onec-content-review-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить Content Contract, без publication или deployment
        run: |
          node tools/validate-content.mjs
          node tools/check-content-review.mjs
          node --test tests/content-contract.test.mjs
          node tools/check-onec-regression.mjs
  preflight:
    needs: content_scope
    if: needs.content_scope.outputs.kind == 'historical-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXUS_M2_EVIDENCE: academy-gold-m2-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить отдельный контракт Intro без изменения допуска M5
        id: startup_intro
        run: node tools/startup-intro-ci-route.mjs
      - name: Node.js 24 для изолированной проверки Intro
        if: steps.startup_intro.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Приёмка Intro — preflight
        if: steps.startup_intro.outputs.enabled == 'true'
        run: node tools/check-startup-intro-ci.mjs --lane preflight
      - name: Сохранить доказательства Intro — preflight
        if: always() && steps.startup_intro.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: startup-intro-preflight-${{ github.sha }}
          path: evidence-startup-intro/preflight/
          retention-days: 14
      - name: Проверить изоляцию от принятого main
        if: steps.startup_intro.outputs.enabled != 'true'
        run: |
          npm ci --prefix server-access --ignore-scripts --no-audit --no-fund
          test "${GITHUB_REF_NAME}" = feature/academy-gold-standard-cpp-module-2 || test "${GITHUB_REF_NAME}" = main || test "${GITHUB_EVENT_NAME}" = pull_request
          git merge-base --is-ancestor d9249b2e977483718cd67a151f62552296dd51e4 HEAD
          node tools/check-academy-gold-module2-dependencies.mjs
          node --test tests/ui1a-deterministic-public-manifest.test.mjs
      - name: Учебные зависимости, stable IDs и NEXUS-PERF-01
        if: steps.startup_intro.outputs.enabled != 'true'
        run: |
          node --test tests/platform-lazy-imports.test.mjs tests/platform-startup-load.test.mjs
          node --test tests/cpp-stream-state-routing.test.mjs
      - name: Реальный host C++20 и UBSan
        if: steps.startup_intro.outputs.enabled != 'true'
        run: node tools/check-academy-gold-module2-cpp.mjs
      - name: Подготовить отдельную локальную сборку и настоящие runtime bytes
        if: steps.startup_intro.outputs.enabled != 'true'
        env:
          NEXUS_PINNED_RUNTIME_DIR: /tmp/nexus-m2-runtime
          NEXUS_GOLD_EVIDENCE: academy-gold-m2-evidence
        run: |
          npm ci --prefix server-access
          npm install --prefix /tmp/nexus-m2-browser --no-save playwright@1.56.1
          /tmp/nexus-m2-browser/node_modules/.bin/playwright install --with-deps chromium
          node tools/build-ui1a-release.mjs --out /tmp/nexus-m2-build
          node tools/prepare-academy-gold-runtime-fixture.mjs
      - name: Строгий допуск runtime Module 2 и реальный Code Studio UI
        if: steps.startup_intro.outputs.enabled != 'true'
        env:
          NEXUS_FRONTEND_DIR: /tmp/nexus-m2-build
          NEXUS_PLAYWRIGHT_MODULE: /tmp/nexus-m2-browser/node_modules/playwright/index.mjs
          NEXUS_PINNED_RUNTIME_DIR: /tmp/nexus-m2-runtime
          NEXUS_JSCPP_FIXTURE: /tmp/nexus-m2-runtime/jscpp.js
        run: node tests/academy-gold-module2-preflight.mjs
      - name: Сохранить фактический результат, включая FAIL
        if: always() && steps.startup_intro.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: academy-gold-m2-0-${{ github.sha }}
          path: academy-gold-m2-evidence/
          retention-days: 30
  module2-gold:
    needs: content_scope
    if: needs.content_scope.outputs.kind == 'historical-release'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXUS_M2_EVIDENCE: academy-gold-module2
      NEXUS_GOLD_EVIDENCE: academy-gold-module2
      NEXUS_FRONTEND_DIR: /tmp/nexus-m2-gold-build
      NEXUS_PLAYWRIGHT_MODULE: /tmp/nexus-m2-gold-browser/node_modules/playwright/index.mjs
      NEXUS_PINNED_RUNTIME_DIR: /tmp/nexus-m2-gold-runtime
      NEXUS_JSCPP_FIXTURE: /tmp/nexus-m2-gold-runtime/jscpp.js
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить отдельный контракт Intro без изменения допуска M5
        id: startup_intro
        run: node tools/startup-intro-ci-route.mjs
      - name: Node.js 24 для изолированной проверки Intro
        if: steps.startup_intro.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Приёмка Intro — browser
        if: steps.startup_intro.outputs.enabled == 'true'
        run: node tools/check-startup-intro-ci.mjs --lane browser
      - name: Сохранить доказательства Intro — browser
        if: always() && steps.startup_intro.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: startup-intro-browser-${{ github.sha }}
          path: evidence-startup-intro/browser/
          retention-days: 14
      - name: 24 Gold объекта, локализация, учебные зависимости и сохранность state
        if: steps.startup_intro.outputs.enabled != 'true'
        run: |
          npm ci --prefix server-access --ignore-scripts --no-audit --no-fund
          node --test tests/academy-gold-content.test.mjs tests/academy-gold-module2-content.test.mjs
          node tools/check-academy-gold-module2-dependencies.mjs
          node tools/check-academy-gold-module2-quality.mjs
      - name: Все программы уроков, заготовки и варианты — настоящий g++ C++20 и UBSan
        if: steps.startup_intro.outputs.enabled != 'true'
        run: node tools/check-academy-gold-module2-examples.mjs
      - name: Отдельная QA сборка и закреплённые runtime bytes
        if: steps.startup_intro.outputs.enabled != 'true'
        run: |
          npm ci --prefix server-access --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/nexus-m2-gold-browser --no-save playwright@1.56.1
          /tmp/nexus-m2-gold-browser/node_modules/.bin/playwright install --with-deps chromium
          node tools/build-ui1a-release.mjs --out /tmp/nexus-m2-gold-build
          node tools/prepare-academy-gold-runtime-fixture.mjs
      - name: Все программы уроков — реальный router, Clang/WASM, Worker и Code Studio UI
        if: steps.startup_intro.outputs.enabled != 'true'
        run: node tests/academy-gold-module2-examples-browser.mjs
      - name: 24 RU/EN урока, desktop/mobile, словарь и холодный Offline
        if: steps.startup_intro.outputs.enabled != 'true'
        env:
          NEXUS_NATIVE_EVIDENCE: academy-gold-module2/browser
        run: node tests/academy-gold-module2-browser-check.mjs
      - name: Сохранить факты проверки Module 2, включая FAIL
        if: always() && steps.startup_intro.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: academy-gold-module2-${{ github.sha }}
          path: academy-gold-module2/
          retention-days: 30
  module1-regression:
    needs: content_scope
    if: needs.content_scope.outputs.kind == 'historical-release'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXUS_GOLD_EVIDENCE: academy-gold-m1-regression
      NEXUS_GOLD_INTEGRATION_BASE: d9249b2e977483718cd67a151f62552296dd51e4
      NEXUS_PLAYWRIGHT_MODULE: /tmp/nexus-m1-browser/node_modules/playwright/index.mjs
      NEXUS_PINNED_RUNTIME_DIR: /tmp/nexus-m1-runtime
      NEXUS_JSCPP_FIXTURE: /tmp/nexus-m1-runtime/jscpp.js
      NEXUS_FRONTEND_DIR: /tmp/nexus-m1-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить отдельный контракт Intro без изменения допуска M5
        id: startup_intro
        run: node tools/startup-intro-ci-route.mjs
      - name: Node.js 24 для изолированной проверки Intro
        if: steps.startup_intro.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Приёмка Intro — integration
        if: steps.startup_intro.outputs.enabled == 'true'
        run: node tools/check-startup-intro-ci.mjs --lane integration
      - name: Сохранить доказательства Intro — integration
        if: always() && steps.startup_intro.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: startup-intro-integration-${{ github.sha }}
          path: evidence-startup-intro/integration/
          retention-days: 14
      - name: Подготовить зависимости проверки
        if: steps.startup_intro.outputs.enabled != 'true'
        run: npm ci --prefix server-access --ignore-scripts --no-audit --no-fund
      - name: Module 1 — Content Quality Gate и регрессия контрактов
        if: steps.startup_intro.outputs.enabled != 'true'
        run: node tools/check-academy-gold-regression.mjs
      - name: Интеграция и неизменность опубликованного main
        if: steps.startup_intro.outputs.enabled != 'true'
        run: node tools/check-academy-gold-integration.mjs
      - name: Module 1 — настоящие C++20 примеры и UBSan
        if: steps.startup_intro.outputs.enabled != 'true'
        run: node tools/check-academy-gold-cpp.mjs
      - name: Подготовить браузерную сборку и точный rollback test.2
        if: steps.startup_intro.outputs.enabled != 'true'
        run: |
          npm install --prefix /tmp/nexus-m1-browser --no-save playwright@1.56.1
          /tmp/nexus-m1-browser/node_modules/.bin/playwright install --with-deps chromium
          node tools/build-ui1a-release.mjs --out /tmp/nexus-m1-build
          node tools/prepare-academy-gold-runtime-fixture.mjs
          git worktree add --detach /tmp/nexus-m1-rollback-source d9249b2e977483718cd67a151f62552296dd51e4
          node tools/snapshot-published-build.mjs --source /tmp/nexus-m1-rollback-source --out /tmp/nexus-m1-rollback --expected-commit d9249b2e977483718cd67a151f62552296dd51e4
      - name: Module 1 — полный настоящий runtime matrix, UI и холодный Offline
        if: steps.startup_intro.outputs.enabled != 'true'
        env:
          NEXUS_NATIVE_EVIDENCE: academy-gold-m1-regression/runtime-browser
        run: node tests/academy-gold-runtime-browser-check.mjs
      - name: Module 1 — desktop, mobile, словарь, доступность и Offline
        if: steps.startup_intro.outputs.enabled != 'true'
        env:
          NEXUS_NATIVE_EVIDENCE: academy-gold-m1-regression/browser
        run: node tests/academy-gold-browser-check.mjs
      - name: Home, Account, media и стартовая загрузка
        if: steps.startup_intro.outputs.enabled != 'true'
        run: |
          NEXUS_NATIVE_EVIDENCE=academy-gold-m1-regression/startup node tests/platform-startup-browser-check.mjs
          NEXUS_NATIVE_EVIDENCE=academy-gold-m1-regression/administration node tests/platform-admin-browser-check.mjs
          NEXUS_NATIVE_EVIDENCE=academy-gold-m1-regression/public-media node tests/blog-media-public-browser-check.mjs
      - name: Native PWA upgrade/rollback и сохранность синтетических работ/прогресса
        if: steps.startup_intro.outputs.enabled != 'true'
        env:
          NEXUS_ROLLBACK_DIR: /tmp/nexus-m1-rollback
          NEXUS_BROWSER_RESULT: academy-gold-m1-regression/PWA_ROLLBACK.json
        run: node tests/pwa-rollback-browser-check.mjs
      - name: Сохранить фактические результаты Module 1
        if: always() && steps.startup_intro.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: academy-gold-m1-regression-${{ github.sha }}
          path: academy-gold-m1-regression/
          retention-days: 30
