name: Invited email/password preflight (source only)
on:
  push:
    branches: [feature/invited-email-password-2026-11-02]
    paths:
      - server-access/**
      - core/account-control.js
      - tools/invited-password-ci-scope.mjs
      - tests/invited-password-ci-scope.test.mjs
      - .github/workflows/invited-password-preflight.yml
  pull_request:
    paths:
      - server-access/**
      - core/account-control.js
      - tools/invited-password-ci-scope.mjs
      - tests/invited-password-ci-scope.test.mjs
      - .github/workflows/invited-password-preflight.yml
permissions:
  contents: read
jobs:
  safety-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --test tests/invited-password-ci-scope.test.mjs tests/content-publication-route.test.mjs
          node --check server-access/worker/invited-password-service.mjs
          node --check server-access/bff/invited-password.mjs
          node --check server-access/worker/entry.mjs
          node --check server-access/worker/admin-service.mjs
          node --check server-access/public/password.js
          node --check server-access/check-invited-password.mjs
      - name: Install pinned server dependencies
        run: npm ci --prefix server-access --ignore-scripts
      - name: Staging isolation and real local TLS SMTP
        run: node --test server-access/staging/security.test.mjs
      - name: Audit runtime dependencies
        run: npm audit --prefix server-access --omit=dev --audit-level=high
      - name: Synthetic full-schema invite, password and recovery lifecycle
        run: node --experimental-sqlite server-access/check-invited-password.mjs
      - name: Build BFF and Worker (never deploy)
        run: |
          node server-access/build-worker.mjs
          node server-access/build-bff.mjs
          node server-access/staging/build.mjs "$RUNNER_TEMP/password-staging-build"
      - name: Actual local workerd and D1 migrations, races and recovery
        run: node --experimental-sqlite server-access/check-invited-password-workerd.mjs
      - name: Existing identity and invitation regressions
        run: |
          node --experimental-sqlite server-access/check-admin-service.mjs
          node --experimental-sqlite server-access/check-alpha-control-security.mjs
          node --experimental-sqlite server-access/check-public-registration.mjs
          node --experimental-sqlite server-access/check-passkey-cancelled-enrollment.mjs
          node --experimental-sqlite server-access/check-oauth-service.mjs
          node server-access/check-oauth-bff.mjs
          node server-access/check-account-control-bff.mjs
          node --experimental-sqlite server-access/check-cloud-session.mjs
          node server-access/check-gateway-cookie-context.mjs
          node server-access/check-entry-gate.mjs
          node --experimental-sqlite tests/individual-trial-access.test.mjs
          node tests/identity-session-foundation-check.mjs
          node tests/account-storage-isolation-check.mjs
          node --test tests/worker-network.test.mjs
      - name: Browser enrollment, login and recovery without WebAuthn
        run: |
          npm ci --prefix tools/qa-browser-driver --ignore-scripts
          node tools/qa-browser-driver/node_modules/playwright/cli.js install --with-deps chromium
          node server-access/check-invited-password-browser.mjs
