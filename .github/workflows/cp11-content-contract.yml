name: CP-1.1 Content Contract

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'courses/cpp/content-package.json'
      - 'tools/content-contract-lib.mjs'
      - 'tools/validate-content.mjs'
      - 'tests/content-contract.test.mjs'
      - 'docs/ru/03-content/CP1_1_*.md'
      - 'docs/ru/03-content/CONTENT_CONTRACT_CP1_1.md'
      - 'docs/ru/adr/ADR-0021-CP1_1-CONTENT-CONTRACT.md'
      - '.github/workflows/cp11-content-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'courses/cpp/content-package.json'
      - 'tools/content-contract-lib.mjs'
      - 'tools/validate-content.mjs'
      - 'tests/content-contract.test.mjs'
      - 'docs/ru/03-content/CP1_1_*.md'
      - 'docs/ru/03-content/CONTENT_CONTRACT_CP1_1.md'
      - 'docs/ru/adr/ADR-0021-CP1_1-CONTENT-CONTRACT.md'
      - '.github/workflows/cp11-content-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CP-1.1 additive-only boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p cp11-evidence
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" | tee cp11-evidence/00_DIFF_NAME_STATUS.txt
          bad=0
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/cp11-content-contract.yml|content/*|courses/cpp/content-package.json|tools/content-contract-lib.mjs|tools/validate-content.mjs|tests/content-contract.test.mjs|docs/ru/03-content/CP1_1_*.md|docs/ru/03-content/CONTENT_CONTRACT_CP1_1.md|docs/ru/adr/ADR-0021-CP1_1-CONTENT-CONTRACT.md)
                ;;
              *)
                echo "FORBIDDEN_CP11_CHANGE $file" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "$bad" -eq 0
          echo "CP11_ADDITIVE_ONLY_BOUNDARY_PASS"

      - name: CP-1.1 schema and semantic validation
        run: |
          set -o pipefail
          mkdir -p cp11-evidence
          {
            node tools/validate-content.mjs
            node --test tests/content-contract.test.mjs
          } | tee cp11-evidence/01_CONTENT_CONTRACT_TESTS.txt

      - name: Existing C++ and Academy regression
        run: |
          set -o pipefail
          {
            node tests/production-entry-syntax-check.mjs
            node tests/benchmark-content-check.mjs
            node tests/lesson-standard-freeze-check.mjs
            node tests/programming-language-catalog-check.mjs
            node tests/public-content-check.mjs
            node tests/shared-learning-views-check.mjs
          } | tee cp11-evidence/02_CPP_ACADEMY_REGRESSION.txt

      - name: Code Studio and Project Studio regression
        run: |
          set -o pipefail
          {
            node tests/module-import-smoke-check.mjs
            node tests/code-studio-foundation-check.mjs
            node tests/project-studio-foundation-check.mjs
          } | tee cp11-evidence/03_STUDIO_REGRESSION.txt

      - name: Offline/PWA regression
        run: |
          set -o pipefail
          {
            node tests/offline-learning-check.mjs
            node tests/pwa-policy-check.mjs
          } | tee cp11-evidence/04_OFFLINE_PWA_REGRESSION.txt

      - name: Cloud Sync contract regression
        run: |
          set -o pipefail
          {
            node tests/cloud-sync-client-transport-check.mjs
            node tests/cloud-sync-session-first-migration-check.mjs
            node tests/cloud-sync-ui-check.mjs
            node tests/cloud-unified-client-check.mjs
          } | tee cp11-evidence/05_CLOUD_SYNC_REGRESSION.txt

      - name: Evidence hashes
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'workflow-dispatch' }}
        run: |
          mkdir -p cp11-evidence
          {
            echo "CP-1.1 HEAD $HEAD_SHA"
            echo "CP-1.1 BASE $BASE_SHA"
            echo "Generated by GitHub Actions; no production credentials are collected."
          } > cp11-evidence/README.txt
          sha256sum \
            content/README.md \
            content/schemas/content-package-v1.schema.json \
            courses/cpp/content-package.json \
            tools/content-contract-lib.mjs \
            tools/validate-content.mjs \
            tests/content-contract.test.mjs \
            .github/workflows/cp11-content-contract.yml \
            docs/ru/03-content/CONTENT_CONTRACT_CP1_1.md \
            docs/ru/03-content/CP1_1_*.md \
            docs/ru/adr/ADR-0021-CP1_1-CONTENT-CONTRACT.md \
            > cp11-evidence/SHA256SUMS_CP1_1.txt

      - name: Upload CP-1.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp11-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: cp11-evidence/
          if-no-files-found: error
          retention-days: 30
