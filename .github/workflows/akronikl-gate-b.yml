name: Akronikl — единый кандидат и холодный публичный офлайн
on:
  push:
    branches: [feature/akronikl-0-2-gate-b-20261026]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Сохранить точный источник и проверить единый кандидат
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-gate-b-regression
          git rev-parse HEAD > evidence-gate-b-regression/SOURCE_COMMIT.txt
          git archive --format=zip HEAD > evidence-gate-b-regression/source.zip
          (cd evidence-gate-b-regression && sha256sum source.zip > SOURCE_SHA256.txt)
          node --test tests/akronikl-core.test.mjs tests/akronikl-knowledge.test.mjs tests/akronikl-security.test.mjs tests/akronikl-ui.test.mjs tests/akronikl-ui-lifecycle.test.mjs tests/akronikl-ui-readiness.test.mjs | tee evidence-gate-b-regression/core-ui.tap
          node --test tests/platform-startup-load.test.mjs tests/platform-startup-views.test.mjs tests/platform-lazy-imports.test.mjs | tee evidence-gate-b-regression/startup.tap
          node tests/auth-bootstrap-check.mjs | tee evidence-gate-b-regression/bootstrap.txt
          node tests/account-storage-isolation-check.mjs | tee evidence-gate-b-regression/account.txt
          node tests/module-import-smoke-check.mjs | tee evidence-gate-b-regression/imports.txt
          node tools/build-akronikl-knowledge.mjs --check | tee evidence-gate-b-regression/knowledge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akronikl-gate-b-regression
          path: evidence-gate-b-regression
          retention-days: 30
  built-public-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXUS_FRONTEND_DIR: /tmp/ak02-gate-b-build
      NEXUS_AKRONIKL_EVIDENCE: ${{ github.workspace }}/evidence-gate-b-browser
      NEXUS_SOURCE_COMMIT: ${{ github.sha }}
      NEXUS_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/qa-browser-driver/node_modules/playwright/index.mjs
      NEXUS_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Подготовить закреплённые зависимости и отдельную staging-сборку
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-gate-b-browser
          npm ci --prefix server-access --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/qa-browser-driver --ignore-scripts --no-audit --no-fund
          test -x /usr/bin/google-chrome
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('version.json')).version")
          node tools/build-ui1a-release.mjs --out "$NEXUS_FRONTEND_DIR" --generation ui1a-akronikl-02-gate-b-20261026 --version "$VERSION" | tee evidence-gate-b-browser/build.txt
          cp "$NEXUS_FRONTEND_DIR/BUILD_MANIFEST.json" evidence-gate-b-browser/
          node tools/check-akronikl-built-candidate.mjs
      - name: Native ESM и настоящий SW — публичный холодный старт, без Account
        run: node tests/akronikl-built-offline-browser-check.mjs
      - name: Регрессия компонента на едином кандидате
        env:
          NEXUS_AKRONIKL_EVIDENCE: ${{ github.workspace }}/evidence-gate-b-browser/component
        run: node tests/akronikl-component-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akronikl-gate-b-browser
          path: evidence-gate-b-browser
          retention-days: 30
