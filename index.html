<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="description" content="AKRONIKL IT NEXUS — бесплатная инженерная образовательная IT-платформа"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png"><link rel="stylesheet" href="./styles/app.css?v=0.1.7-alpha.2.2"><title>AKRONIKL IT NEXUS</title></head><body><div id="boot-status" class="boot-screen"><div class="brand-mark">ANX</div><h1>AKRONIKL IT NEXUS</h1><p>Запускаем Platform Shell v0.1.7-alpha.2.2…</p><small>Boot Recovery включён: если модуль не загрузится, здесь появится точная причина.</small></div><div id="app"></div><noscript><div class="boot-error">Для интерактивной платформы требуется JavaScript.</div></noscript><script>
(()=>{
  const VERSION='0.1.7-alpha.2.2';
  let finished=false;
  const boot=()=>document.getElementById('boot-status');
  const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  const show=(title,detail)=>{const node=boot();if(!node||finished)return;node.className='boot-error';node.innerHTML=`<strong>${esc(title)}</strong><p>Platform Shell v${VERSION}</p><pre>${esc(detail||'Неизвестная ошибка загрузки')}</pre><small>Проверьте, что PATCH загружен полностью, особенно папку project-studio/. После публикации выполните Ctrl+F5.</small>`};
  window.__NEXUS_BOOT_OK__=()=>{finished=true};
  window.addEventListener('error',event=>{const target=event.target;const resource=target&&(target.src||target.href);const detail=event.error?.stack||event.message||(resource?`Не удалось загрузить ресурс: ${resource}`:'Ошибка загрузки модуля');show('Nexus не завершил загрузку',detail)},true);
  window.addEventListener('unhandledrejection',event=>{show('Необработанная ошибка запуска',event.reason?.stack||event.reason?.message||event.reason)});
  setTimeout(()=>{if(boot()&&!finished)show('Запуск Nexus занял слишком много времени','Bootstrap не завершился за 12 секунд. Возможна неполная публикация GitHub Pages, устаревший Service Worker или отсутствующий JS-модуль.')},12000);
})();
</script><script type="module" src="./core/app.js?v=0.1.7-alpha.2.2"></script></body></html>
